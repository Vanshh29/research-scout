[project]
name = "research-scout"
version = "0.1.0"
description = "Autonomous research agent: daily ingest, ranking, knowledge graph, and eval harness for LLM agents / RAG research."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vansh Choudhary" }]
dependencies = [
    "fastapi>=0.159.1",
    "fastembed>=0.9.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
scout = "scout.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "sqlite_vec.*", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
