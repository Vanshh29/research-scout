# Interest profile used for ranking.
topics:
  - LLM agents
  - tool use and function calling
  - agent evaluation and benchmarks
  - LLM-as-a-judge
  - retrieval-augmented generation
  - RAG evaluation
  - prompt injection and agent security
  - long-context vs retrieval tradeoffs
  - multi-agent systems
  - structured outputs
  - inference cost and latency optimization

# Positive examples for the profile embedding.
seed_papers:
  - "ReAct: Synergizing Reasoning and Acting in Language Models"
  - "Reflexion: Language Agents with Verbal Reinforcement Learning"
  - "Toolformer: Language Models Can Teach Themselves to Use Tools"
  - "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection"
  - "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?"
  - "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
  - "RAGAS: Automated Evaluation of Retrieval Augmented Generation"

seed_repos:
  - langchain-ai/langgraph
  - princeton-nlp/SWE-agent
  - All-Hands-AI/OpenHands
  - UKGovernmentBEIS/inspect_ai
  - promptfoo/promptfoo

# Hybrid score = embedding * w_emb + llm * w_llm (must sum to 1).
weights:
  embedding: 0.4
  llm: 0.6

# LLM rubric dimensions, each scored 0-1, averaged with these weights.
rubric:
  relevance: 0.4
  novelty: 0.2
  evidence_quality: 0.2
  actionability: 0.2

# Stage 1 keeps this many candidates for the LLM; the brief shows top_n.
top_k: 25
top_n: 8
